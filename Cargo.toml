[package]
name = "bloodhound"
version = "0.1.0"
edition = "2024"
authors = ["Dev Nambiar"]
description = "Ultra-fast CLI search engine built in Rust with SIMD acceleration and persistent trigram indexing"
repository = "https://github.com/Starmarine06/Bloodhound-Search"
license = "MIT"
default-run = "bh"

[[bin]]
name = "bh"
path = "src/main.rs"

[profile.release]
lto = "thin"
codegen-units = 1
panic = "abort"
strip = true

[dependencies]
aho-corasick = "1.1.5"
anyhow = "1.0.104"
bincode = { version = "2.0.1", features = ["serde"] }
clap = { version = "4.6.7", features = ["derive"] }
grep-matcher = "0.1.9"
grep-regex = "0.1.14"
ignore = "0.4.33"
lz4_flex = { version = "0.14.0", features = ["safe-decode"] }
memchr = "2.8.3"
memmap2 = "0.9.11"
regex = "1.10"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"

[dev-dependencies]
assert_cmd = "2.2.2"
predicates = "3.1.4"
tempfile = "3.27.0"
