name: Release & Publish to npm

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write
  id-token: write

jobs:
  build-binaries:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            pkg: win32-x64
            bin: bh.exe
          - os: windows-latest
            target: aarch64-pc-windows-msvc
            pkg: win32-arm64
            bin: bh.exe
          - os: macos-13
            target: x86_64-apple-darwin
            pkg: darwin-x64
            bin: bh
          - os: macos-latest
            target: aarch64-apple-darwin
            pkg: darwin-arm64
            bin: bh
          - os: ubuntu-latest
            target: x86_64-unknown-linux-musl
            pkg: linux-x64
            bin: bh
            use_cross: true
          - os: ubuntu-latest
            target: aarch64-unknown-linux-musl
            pkg: linux-arm64
            bin: bh
            use_cross: true

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install cross (for Linux musl / ARM)
        if: matrix.use_cross
        run: cargo install cross --git https://github.com/cross-rs/cross

      - name: Build binary
        run: |
          if [ "${{ matrix.use_cross }}" = "true" ]; then
            cross build --release --target ${{ matrix.target }}
          else
            cargo build --release --target ${{ matrix.target }}
          fi
        shell: bash

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: binary-${{ matrix.pkg }}
          path: target/${{ matrix.target }}/release/${{ matrix.bin }}
          if-no-files-found: error

  publish-npm:
    name: Publish to npm
    needs: build-binaries
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: 'https://registry.npmjs.org'

      - name: Download all built binaries
        uses: actions/download-artifact@v4
        with:
          path: downloaded-artifacts

      - name: Prepare npm platform packages
        run: |
          node scripts/package-all.js
          
          # Move downloaded artifacts into corresponding package bin folders
          for pkg in win32-x64 win32-arm64 darwin-x64 darwin-arm64 linux-x64 linux-arm64; do
            if [ -d "downloaded-artifacts/binary-$pkg" ]; then
              cp downloaded-artifacts/binary-$pkg/* packages/$pkg/bin/
              chmod +x packages/$pkg/bin/* || true
            fi
          done

      - name: Publish platform packages to npm
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          for dir in packages/*; do
            if [ -d "$dir" ] && [ -n "$(ls -A $dir/bin 2>/dev/null)" ]; then
              echo "Publishing $dir..."
              cd "$dir"
              npm publish --access public --provenance
              cd ../..
            fi
          done

      - name: Publish root package to npm
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          npm publish --access public --provenance
